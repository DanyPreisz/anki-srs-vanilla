<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anki SRS · Vanilla JS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">Node http · JS vanilla</p>
      <h1>Anki</h1>
      <p class="lede" id="left"></p>
      <div class="card" id="card"></div>
      <div class="row" id="grades" hidden>
        <button type="button" data-g="again">Otra</button>
        <button type="button" data-g="hard">Difícil</button>
        <button type="button" data-g="good">Bien</button>
      </div>
      <form id="add">
        <input id="front" placeholder="Frente" required />
        <input id="back" placeholder="Dorso" required />
        <button type="submit">+ Carta</button>
      </form>
    </main>
    <script src="app.js"></script>
  </body>
</html>
